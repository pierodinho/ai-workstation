name: Application checks
on:
  push:
    branches: [main, feature/private-pwa-monitoring]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p test_public.py -v
      - run: node --check app.js && node --check enhance.js && node --check sw.js
